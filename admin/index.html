<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Admin · Cardápio Dinâmico</title>
  <link rel="stylesheet" href="admin.css" />
</head>
<body>

  <!-- Tela de login: só pede o PAT + owner/repo do GitHub -->
  <section id="tela-login" class="tela-central">
    <form id="form-login" class="cartao">
      <h1>Painel administrativo</h1>
      <p class="ajuda">
        Cole um Personal Access Token (fine-grained) com permissão
        "Contents: Read and write" restrita a este repositório.
      </p>

      <label for="input-owner">Dono do repositório (usuário/organização)</label>
      <input id="input-owner" name="owner" type="text" autocomplete="off" required />

      <label for="input-repo">Nome do repositório</label>
      <input id="input-repo" name="repo" type="text" autocomplete="off" required />

      <label for="input-token">GitHub Personal Access Token</label>
      <input id="input-token" name="token" type="password" autocomplete="off" required />

      <button type="submit">Entrar</button>
      <p id="login-erro" class="mensagem-erro" hidden></p>
    </form>
  </section>

  <!-- Painel principal: só aparece depois de validar o token -->
  <section id="tela-painel" hidden>
    <header class="topo">
      <div class="topo__selecao">
        <label for="select-restaurante">Restaurante</label>
        <select id="select-restaurante"></select>
      </div>
      <button id="btn-logout" class="botao-secundario" type="button">Sair</button>
    </header>

    <p id="status" class="status" role="status" hidden></p>

    <main class="conteudo">
      <div class="lista-cabecalho">
        <h2>Pratos</h2>
        <button id="btn-novo-prato" type="button">+ Novo prato</button>
      </div>
      <ul id="lista-pratos" class="lista-pratos"></ul>
    </main>
  </section>

  <!-- Modal de criação/edição de prato -->
  <div id="modal-prato" class="modal" hidden>
    <form id="form-prato" class="cartao modal__caixa">
      <h2 id="form-prato-titulo">Novo prato</h2>

      <input type="hidden" id="prato-id" />

      <label for="prato-nome">Nome *</label>
      <input id="prato-nome" required />

      <label for="prato-descricao">Descrição</label>
      <textarea id="prato-descricao" rows="2"></textarea>

      <label for="prato-preco">Preço (R$) *</label>
      <input id="prato-preco" type="number" min="0" step="0.01" required />

      <label for="prato-categoria">Categoria *</label>
      <select id="prato-categoria" required></select>

      <label for="prato-imagem-url">URL da imagem (opcional)</label>
      <input id="prato-imagem-url" type="text" placeholder="assets/nome-do-arquivo.jpg" />

      <label for="prato-imagem-arquivo">Ou enviar novo arquivo de imagem</label>
      <input id="prato-imagem-arquivo" type="file" accept="image/*" />

      <label class="linha-checkbox">
        <input id="prato-disponivel" type="checkbox" checked />
        Disponível no cardápio
      </label>

      <div class="modal__acoes">
        <button type="button" id="btn-cancelar-prato" class="botao-secundario">Cancelar</button>
        <button type="submit">Salvar</button>
      </div>
    </form>
  </div>

  <script type="module" src="admin.js"></script>
</body>
</html>
